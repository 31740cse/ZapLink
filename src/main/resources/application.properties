spring.config.import=optional:file:./application-local.properties

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=${PORT:8080}
server.error.include-message=always

# ============================================
# DATABASE - PostgreSQL
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zaplink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:zaplink}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:zaplink}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# ZAPLINK CUSTOM CONFIGURATION
# ============================================
zaplink.name=ZapLink
zaplink.version=1.0.0
zaplink.short-url-base=${ZAPLINK_SHORT_URL_BASE:}
zaplink.short-code-length=8
zaplink.base62-alphabet=0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
zaplink.default-url-expiration-days=365
zaplink.cache-ttl-hours=24
zaplink.rate-limit-requests-per-minute=100

# ============================================
# SECURITY & JWT
# ============================================
zaplink.jwt-secret=${ZAPLINK_JWT_SECRET}
zaplink.jwt-expiration-ms=${ZAPLINK_JWT_EXPIRATION_MS}
zaplink.password-min-length=8
zaplink.allowed-origins=${ZAPLINK_ALLOWED_ORIGINS}

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.zaplink=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Serve static files
spring.web.resources.static-locations=classpath:/static/


