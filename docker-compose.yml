services:
  app:
    build: .
    container_name: zaplink-app
    restart: unless-stopped
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_SSLMODE: ${SPRING_DATASOURCE_SSLMODE:-require}
      ZAPLINK_SHORT_URL_BASE: ${ZAPLINK_SHORT_URL_BASE:-}
      ZAPLINK_JWT_SECRET: ${ZAPLINK_JWT_SECRET:?Set ZAPLINK_JWT_SECRET}
      ZAPLINK_JWT_EXPIRATION_MS: ${ZAPLINK_JWT_EXPIRATION_MS:-86400000}
      ZAPLINK_ALLOWED_ORIGINS: ${ZAPLINK_ALLOWED_ORIGINS:?Set ZAPLINK_ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
